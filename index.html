<body class="min-h-screen flex flex-col">

<script>
  const items = [
    { name: "Selenium - Home Page Concept", date: "Nov 2025", originalLabel: "View", originalHref: "https://www.selenium.dev/", designHref: "selenium.html" },
    { name: "CHLAVM - Education &amp; Learning Concept", date: "Mar 2025", originalLabel: "Original Idea", originalHref: null, designHref: "chlavm-edu.html" },
    { name: "CHLAVM - Embassies &amp; Consulates Concept", date: "Mar 2025", originalLabel: "View", originalHref: "https://www.chlavm.ca/en/community-in-action/embassies-and-consulates", designHref: "chlavm-embcon.html" },
    { name: "Note4U - Marketing Landing Page", date: "Jan 2025", originalLabel: "Original Idea", originalHref: null, designHref: "note4u.html" },
    { name: "Epitome - Tech Training One-Pager Mockup", date: "Dec 2022", originalLabel: "Client Concept Mockup", originalHref: null, designHref: "epitome.html" },
    { name: "Caterpillar - SaaS Dashboard Design - SiteTrack - Project List", date: "Jan 2020", originalLabel: "Internship Project", originalHref: null, designHref: "CAT-Page1.html" },
    { name: "Caterpillar - SaaS Dashboard Design - SiteTrack - Project View", date: "Jan 2020", originalLabel: "Internship Project", originalHref: null, designHref: "CAT-Page2.html" },
    { name: "Caterpillar - SaaS Dashboard Design - SiteTrack - Task View", date: "Jan 2020", originalLabel: "Internship Project", originalHref: null, designHref: "CAT-Page3.html" },
  ];

  const PER_PAGE = 5;
  let currentPage = 1;
  const totalPages = Math.ceil(items.length / PER_PAGE);

  function linkBtn(label, href) {
    if (href) return `<a class="karthik-btn karthik-btn--primary" href="${href}" target="_blank">${label}<span class="material-symbols-outlined text-[18px]">arrow_forward</span></a>`;
    return `<span class="text-body-md text-on-surface-variant">${label}</span>`;
  }

  function render() {
    const start = (currentPage - 1) * PER_PAGE;
    const slice = items.slice(start, start + PER_PAGE);

    document.getElementById('table-body').innerHTML = slice.map(item => `
      <tr class="hover:bg-surface-container-highest/5 transition-colors">
        <td class="px-gutter py-6"><span class="font-body-lg font-semibold text-on-surface">${item.name}</span></td>
        <td class="px-gutter py-6 text-body-md text-on-surface-variant">${item.date}</td>
        <td class="px-gutter py-6 text-body-md text-on-surface-variant">${linkBtn(item.originalLabel, item.originalHref)}</td>
        <td class="px-gutter py-6 text-body-md text-on-surface-variant">${linkBtn('View', item.designHref)}</td>
      </tr>
    `).join('');

    document.getElementById('page-info').textContent =
      `Showing ${start + 1}–${Math.min(start + PER_PAGE, items.length)} of ${items.length}`;

    const pg = document.getElementById('pagination');
    pg.innerHTML = '';

    const prev = document.createElement('button');
    prev.className = 'pg-btn';
    prev.innerHTML = '&lsaquo;';
    prev.disabled = currentPage === 1;
    prev.onclick = () => { currentPage--; render(); };
    pg.appendChild(prev);

    for (let p = 1; p <= totalPages; p++) {
      const b = document.createElement('button');
      b.className = 'pg-btn' + (p === currentPage ? ' active' : '');
      b.textContent = p;
      b.onclick = ((_p) => () => { currentPage = _p; render(); })(p);
      pg.appendChild(b);
    }

    const next = document.createElement('button');
    next.className = 'pg-btn';
    next.innerHTML = '&rsaquo;';
    next.disabled = currentPage === totalPages;
    next.onclick = () => { currentPage++; render(); };
    pg.appendChild(next);
  }

  render();
</script>
